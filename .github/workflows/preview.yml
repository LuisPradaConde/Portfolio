name: Preview build (no deploy)
on:
  push:
    branches: [portfolio-gestion-vulnerabilidades]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
      - name: Push build to temporary branch
        run: |
          cd out
          git init -q -b preview-build
          git config user.name preview-bot
          git config user.email preview-bot@users.noreply.github.com
          git add -A && git commit -q -m preview
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" preview-build
