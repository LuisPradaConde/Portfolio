name: Preview build (no deploy)
on:
  push:
    branches: [portfolio-gestion-vulnerabilidades]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
      - uses: actions/upload-artifact@v4
        with:
          name: preview-out
          path: out
          retention-days: 1
